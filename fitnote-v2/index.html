<script>
'use strict';
const KEY='fitnote_v2_20261026';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ico=name=>`<svg class="icon" aria-hidden="true"><use href="#i-${name}"></use></svg>`;
const localDate=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parseDate=s=>new Date(s+'T12:00:00');
const shifted=(s,n)=>{const d=parseDate(s);d.setDate(d.getDate()+n);return localDate(d)};
const today=localDate();
const baseRecords=()=>{let out=[];for(let i=20;i>=0;i-=3){let d=shifted(today,-i);out.push({date:d,weight:Math.round((79.5-i*.01-(20-i)*.065+(Math.sin(i*1.7)*.12))*10)/10,bf:Math.round((20.5-(20-i)*.055)*10)/10})}out.push({date:today,weight:78.1,bf:19.3});return out};
const initial=()=>({version:2,demo:true,profile:{name:'ゲスト',age:31,sex:'male',height:175,weight:78.1,bf:19.3,targetWeight:74,targetBF:15,targetDate:'2027-01-31',activity:1.375,style:'balanced',pace:'standard',proteinFactor:1.6,kcalOverride:null,shake:1,shakeMacros:{p:24,f:2,c:3},mealTiming:['朝食','昼食','夕食','間食'],distribution:'even',trainingDays:[1,4]},records:baseRecords(),mealLog:{},mealChoice:{},mealTitles:{},workoutLog:{},favorites:[],wizardDone:false});
let state;try{state=JSON.parse(localStorage.getItem(KEY))||initial()}catch(e){state=initial()};if(!state.profile||!Array.isArray(state.records))state=initial();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){notify('保存できませんでした。ブラウザの保存設定をご確認ください')}};
let page=state.profile.wizardDone?'home':'wizard',modal='',wizardStep=0,viewRange=30,selectedPoint=null,chosenDate=today,selectedMuscle='胸',selectedExercise='bench',exerciseTab='guide',bodySide='front',weekOffset=0,customDays={},toastTimer=0;
const names=['日','月','火','水','木','金','土'];
const fnum=n=>Number.isFinite(Number(n))?Number(n):0;
const round=n=>Math.round(n);
const clamp=(n,a,b)=>Math.min(b,Math.max(a,n));
function targets(date=today){const p=state.profile,wt=clamp(fnum(p.weight)||78,30,300),height=clamp(fnum(p.height)||175,100,230),age=clamp(fnum(p.age)||31,15,95),bmr=10*wt+6.25*height-5*age+(p.sex==='female'?-161:5),tdee=round(bmr*fnum(p.activity||1.375));let days=Math.max(1,Math.round((parseDate(p.targetDate||today)-parseDate(today))/86400000));let delta=clamp((wt-fnum(p.targetWeight||wt))*7700/days,-850,850);let preset=p.pace==='slow'?.65:p.pace==='fast'?1.3:1;let planned=round(tdee-delta*preset);const floor=p.sex==='female'?1200:1500;planned=Math.max(floor,planned);let kcal=p.kcalOverride!==null&&p.kcalOverride!==''?clamp(round(fnum(p.kcalOverride)),1000,6000):planned;let protein=round(wt*fnum(p.proteinFactor||1.6));let fat=round(kcal*(p.style==='lowfat'?.19:p.style==='lowcarb'?.36:p.style==='keto'?.68:.27)/9);let carbs=Math.max(0,round((kcal-protein*4-fat*9)/4));if(p.style==='keto'){carbs=Math.min(40,carbs);fat=Math.max(0,round((kcal-protein*4-carbs*4)/9))}const diffDays=(parseDate(date)-parseDate(today))/86400000;let factor=1;if(p.distribution==='training'){factor=(p.trainingDays||[1,4]).includes(parseDate(date).getDay())?1.08:.968}if(p.distribution==='custom'){factor=1+fnum((customDays||{})[parseDate(date).getDay()]||0)/100}let k=round(kcal*factor);let pr=protein,ft=round(fat*factor),cb=Math.max(0,round((k-pr*4-ft*9)/4));return {tdee,bmr,kcal:k,protein:pr,fat:ft,carbs:cb,days,warning:kcal<=floor};}
function dayLog(date){return state.mealLog[date]||{}};
function getMeals(date=chosenDate){const t=targets(date),p=state.profile,shake=clamp(fnum(p.shake),0,5),shakeP=shake*fnum(p.shakeMacros?.p??24),shakeF=shake*fnum(p.shakeMacros?.f??2),shakeC=shake*fnum(p.shakeMacros?.c??3);let weights=[.25,.36,.31,.08];let keys=['朝食','昼食','夕食','間食'];let active=keys.map(k=>(p.mealTiming||keys).includes(k));if(!active.some(Boolean))active=[true,true,true,true];let sum=weights.reduce((a,v,i)=>a+(active[i]?v:0),0);let remP=Math.max(0,t.protein-shakeP),remF=Math.max(0,t.fat-shakeF),remC=Math.max(0,t.carbs-shakeC);const style=menus[p.style]||menus.balanced;return keys.filter((k,i)=>active[i]).map(k=>{let i=keys.indexOf(k),id=k,option=clamp(Number(state.mealChoice[k]||0),0,style[k].length-1),def=style[k][option],part=weights[i]/sum;let m={id,name:state.mealTitles[k]||def.name,description:def.desc,emoji:def.emoji,p:round(remP*part),f:round(remF*part),c:round(remC*part)};m.kcal=round(m.p*4+m.f*9+m.c*4);return m})}

 balanced:{'朝食':[{name:'卵と納豆の朝ごはん',desc:'卵・納豆・ご飯・味噌汁・ヨーグルト',emoji:'🍳'},{name:'オートミール朝食',desc:'オートミール・牛乳・バナナ・卵',emoji:'🥣'},{name:'鮭とご飯の和朝食',desc:'鮭・ご飯・豆腐・野菜',emoji:'🍚'}],'昼食':[{name:'鶏むね肉の定食',desc:'鶏むね肉・ご飯・ブロッコリー・スープ',emoji:'🍗'},{name:'サーモン丼',desc:'サーモン・ご飯・枝豆・海藻',emoji:'🍣'},{name:'牛赤身のランチ',desc:'牛赤身肉・ご飯・野菜サラダ',emoji:'🥩'}],'夕食':[{name:'鮭の和食セット',desc:'鮭・ご飯・豆腐・具沢山味噌汁',emoji:'🐟'},{name:'鶏肉のグリルプレート',desc:'鶏むね肉・じゃがいも・野菜',emoji:'🥗'},{name:'豚ヒレの生姜焼き',desc:'豚ヒレ・ご飯・ほうれん草',emoji:'🍱'}],'間食':[{name:'果物とギリシャヨーグルト',desc:'ギリシャヨーグルト・季節の果物',emoji:'🍌'},{name:'チーズとナッツ',desc:'チーズ・ナッツ・果物',emoji:'🧀'}]},
 lowfat:{'朝食':[{name:'脂質控えめの和朝食',desc:'卵白・納豆・ご飯・ヨーグルト',emoji:'🍚'}],'昼食':[{name:'鶏むね肉の野菜丼',desc:'皮なし鶏むね・ご飯・温野菜',emoji:'🍗'}],'夕食':[{name:'白身魚の定食',desc:'タラ・ご飯・野菜・豆腐',emoji:'🐟'}],'間食':[{name:'無脂肪ヨーグルトと果物',desc:'無脂肪ヨーグルト・バナナ',emoji:'🥣'}]},
 lowcarb:{'朝食':[{name:'卵とアボカドプレート',desc:'卵・アボカド・ヨーグルト',emoji:'🥑'}],'昼食':[{name:'チキンサラダランチ',desc:'チキン・豆・サラダ・チーズ',emoji:'🥗'}],'夕食':[{name:'牛赤身と温野菜',desc:'牛肉・きのこ・野菜・豆腐',emoji:'🥩'}],'間食':[{name:'ゆで卵とナッツ',desc:'卵・ミックスナッツ',emoji:'🥚'}]},
 keto:{'朝食':[{name:'卵とアボカド',desc:'卵・アボカド・葉野菜',emoji:'🥑'}],'昼食':[{name:'サーモンのサラダ',desc:'サーモン・オリーブオイル・葉野菜',emoji:'🥗'}],'夕食':[{name:'鶏ももとブロッコリー',desc:'鶏もも・チーズ・ブロッコリー',emoji:'🍗'}],'間食':[{name:'チーズとナッツ',desc:'チーズ・クルミ',emoji:'🧀'}]}
};

const exercises={bench:{name:'ベンチプレス',muscle:'胸',secondary:'肩・腕',guide:'肩甲骨を寄せてベンチに背中を安定させます。足を床につけ、バーを胸のあたりにゆっくり下ろし、肘を伸ばして押し上げます。',breath:'下ろしながら吸い、押し上げながら吐きます。',warning:'肩や手首に痛みがある場合は負荷を下げましょう。'},squat:{name:'スクワット',muscle:'下半身',secondary:'腹筋',guide:'足を肩幅程度に開き、胸と背筋を保ちながら股関節と膝を曲げ、かかとが浮かない範囲でしゃがみます。足裏全体で床を押して立ち上がります。',breath:'しゃがむ前に息を吸い、立ち上がりながら吐きます。',warning:'腰を丸めず、無理のない可動域から始めましょう。'},row:{name:'シーテッドロー',muscle:'背中',secondary:'腕',guide:'背筋を保って座り、ハンドルを握ります。肩甲骨を寄せながら肘を後ろに引き、お腹のほうへ引きつけてゆっくり戻します。',breath:'引くときに吐き、戻すときに吸います。',warning:'上体を過度に反らしたり、反動を使いすぎないようにします。'},press:{name:'ショルダープレス',muscle:'肩',secondary:'腕',guide:'背筋を保って座り、ダンベルを耳の横に構えます。真上へゆっくり押し上げ、コントロールして下ろします。',breath:'押し上げながら吐き、下ろしながら吸います。',warning:'腰を反りすぎないようにしましょう。'},curl:{name:'アームカール',muscle:'腕',secondary:'',guide:'肘を体側に固定し、ダンベルをゆっくり曲げ伸ばしします。',breath:'持ち上げるときに吐きます。',warning:'肩や腰で反動を使わないようにします。'},crunch:{name:'クランチ',muscle:'腹筋',secondary:'',guide:'仰向けで膝を曲げ、お腹を丸める意識で肩甲骨を少し床から浮かせます。',breath:'体を起こすときに吐きます。',warning:'首を手で引っ張らないようにしましょう。'}};

function weekStart(date=today){let d=parseDate(date),w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return localDate(d)}
function weeksDates(offset=0){let start=shifted(weekStart(),offset*7);return Array.from({length:7},(_,i)=>shifted(start,i))}
function workoutSets(date,ex){return Math.max(0,Number(state.workoutLog[date]?.[ex]||0))}
function volumeWeek(m){let sum=0;for(let d of weeksDates(weekOffset)){for(let [id,e] of Object.entries(exercises))if(e.muscle===m)sum+=workoutSets(d,id)}return sum}
function lastTrained(m){let found=null;for(let i=0;i<30;i++){let d=shifted(today,-i);if(Object.entries(exercises).some(([id,e])=>e.muscle===m&&workoutSets(d,id)>0)){found=i;break}}return found}
function recStatus(m){let age=lastTrained(m);return age===null?{label:'未記録',cls:'base',note:'記録から推定できません'}:age>=3?{label:'回復目安',cls:'rest',note:`最終記録${age}日前`}:age>=2?{label:'回復中',cls:'mid',note:`最終記録${age}日前`}:{label:'休息推奨',cls:'busy',note:`最終記録${age}日前`}}
function notify(s){const t=document.getElementById('toast');if(t){t.textContent=s;t.style.opacity='1';clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.style.opacity='0',2600)}}

function remainingText(goal,wt){let diff=Math.abs(wt-goal).toFixed(1);return Math.abs(wt-goal)<.05?'目標体重に到達しています':`現在 ${wt.toFixed(1)}kg ｜ 目標まで ${diff}kg`}

function macroWidget(t){let total=t.protein*4+t.fat*9+t.carbs*4||1;return `<div class="row"><div><div class="small">推奨摂取カロリー（推定）</div><div class="heavy">${t.kcal.toLocaleString()} <span style="font-size:13px">kcal</span></div></div><span class="badge green">${styleNames[state.profile.style]}</span></div><div class="macrobar" style="margin-top:15px"><span style="background:var(--blue);width:${100*t.protein*4/total}%"></span><span style="background:var(--orange);width:${100*t.fat*9/total}%"></span><span style="background:var(--teal);width:${100*t.carbs*4/total}%"></span></div><div class="macrolegend"><div><div class="tiny"><i class="dot" style="background:var(--blue)"></i>P たんぱく質</div><b>${t.protein}g</b></div><div><div class="tiny"><i class="dot" style="background:var(--orange)"></i>F 脂質</div><b>${t.fat}g</b></div><div><div class="tiny"><i class="dot" style="background:var(--teal)"></i>C 炭水化物</div><b>${t.carbs}g</b></div></div>`}

function trainingView(){const day=chosenDate;return `${title('トレーニング','セット数を記録し、部位ごとの負荷を見える化。')}<div class="sectionhead"><h2>週間ボリューム</h2><span class="badge">目標セット数</span></div><div class="card" style="margin-top:0">${weekSelector()}<div class="stack">${Object.keys(muscleTargets).map(k=>{let x=volumeWeek(k),v=muscleTargets[k];return `<div><div class="row" style="margin-bottom:6px"><b style="font-size:12px">${k}</b><span class="small">${x} / ${v}セット</span></div><div class="bar"><span style="width:${clamp(x/v*100,0,100)}%"></span></div></div>`}).join('')}</div></div><div class="sectionhead"><h2>今日の記録</h2><input type="date" id="workDate" value="${esc(chosenDate)}" max="${today}" style="border:1px solid var(--line);border-radius:10px;padding:6px;color:#60718d;background:white;max-width:150px"></div><div class="card" style="margin-top:0"><div class="stack">${Object.entries(exercises).map(([id,e])=>`<div class="workoutcard" style="margin:0"><div class="row"><div><div class="fw">${e.name}</div><div class="tiny">${e.muscle}${e.secondary?'・'+e.secondary:''}</div></div><div class="row"><button class="btncircle" onclick="adjustSet('${id}',-1)" aria-label="${e.name}のセットを減らす">−</button><div class="count">${workoutSets(day,id)}</div><button class="btncircle" onclick="adjustSet('${id}',1)" aria-label="${e.name}のセットを増やす">+</button></div></div><div style="margin-top:8px"><button class="btn link sm" onclick="openExercise('${id}')">フォーム・筋肉の部位を見る ›</button></div></div>`).join('')}</div></div><div class="sectionhead"><h2>筋肉の回復（推定）</h2></div><div class="card" style="margin-top:0">${muscleRecovery()}</div>${footer()}`}
function muscleRecovery(){return `<div class="seg"><button class="${bodySide==='front'?'active':''}" onclick="bodySide='front';render()">前面</button><button class="${bodySide==='back'?'active':''}" onclick="bodySide='back';render()">背面</button></div>${muscleSvg(bodySide)}<div class="row" style="justify-content:center;gap:15px"><span class="tiny"><i class="dot" style="background:#ff929d"></i>休息推奨</span><span class="tiny"><i class="dot" style="background:#ffc474"></i>回復中</span><span class="tiny"><i class="dot" style="background:#1fbea5"></i>回復目安</span></div><div class="grid2" style="margin-top:16px">${Object.keys(muscleTargets).map(k=>{let s=recStatus(k);return `<div class="cardbg"><div class="fw">${k}</div><div class="small">${s.label}</div><div class="tiny">${s.note}</div></div>`}).join('')}</div><p class="note">回復の色は運動記録から48〜72時間を仮定した簡易目安です。実際の疲労・筋肉痛・体調とは一致しない場合があります。</p>`}

function mealsView(){const t=targets(chosenDate),p=state.profile,meals=getMeals(chosenDate),log=dayLog(chosenDate),shake=fnum(p.shake),done=meals.filter(m=>log[m.id]).length+(log.shake?1:0),total=meals.length+(shake?1:0);return `${title('食事プラン','目標PFCを満たす献立を選択できます。')}<div class="card" style="margin-top:15px"><div class="row" style="margin-bottom:12px"><b>食事設定</b><button class="btn link sm" onclick="openWizard(4)">設定を変更 ›</button></div><div class="row wrap"><span class="badge green">${styleNames[p.style]}</span><div class="row"><span class="small">プロテイン</span><button class="btncircle" onclick="adjustShake(-1)" aria-label="プロテインを1杯減らす">−</button><b class="count">${shake}</b><button class="btncircle" onclick="adjustShake(1)" aria-label="プロテインを1杯増やす">+</button><span class="small">杯</span></div></div><div class="note">1杯あたりの想定：P${fnum(p.shakeMacros?.p??24)}g・F${fnum(p.shakeMacros?.f??2)}g・C${fnum(p.shakeMacros?.c??3)}g。メーカーの表示に合わせて設定で変更できます。</div><div class="line"></div>${macroWidget(t)}</div><div class="sectionhead"><h2>7日間の食事計画</h2><span class="badge gray">日付をタップ</span></div><div class="card" style="margin-top:0">${weekSelector()}<div class="weekday">${weeksDates(weekOffset).map(d=>{let x=targets(d),select=d===chosenDate;return `<button class="day week ${select?'active':''}" onclick="pickDay('${d}')"><div class="d">${names[parseDate(d).getDay()]}</div><div class="n">${parseDate(d).getDate()}</div><div class="calstack"><span style="height:${100*x.protein*4/(x.kcal||1)}%;background:var(--blue)"></span><span style="height:${100*x.fat*9/(x.kcal||1)}%;background:var(--orange)"></span><span style="height:${100*x.carbs*4/(x.kcal||1)}%;background:var(--teal)"></span></div><div style="font-size:9px">${x.kcal}</div></button>`}).join('')}</div><div class="note">青 P／オレンジ F／緑 C。曜日別配分を設定すると目標値が切り替わります。</div></div><div class="sectionhead"><h2>${prettyDate(chosenDate)}の献立</h2><span class="badge">${done}/${total} 完了</span></div><div class="card" style="margin-top:0"><div class="bar"><s function mealRow(m,done){return `<div class="foodrow"><div class="foodemoji" onclick="openMeal('${m.id}')" role="button" tabindex="0" onkeydown="if(event.key==='Enter')openMeal('${m.id}')">${m.emoji}</div><div class="grow" onclick="openMeal('${m.id}')" role="button" tabindex="0" onkeydown="if(event.key==='Enter')openMeal('${m.id}')"><h3>${esc(m.name)}</h3><div class="sub">P${m.p}g / F${m.f}g / C${m.c}g</div><div class="small" style="margin-top:2px;font-weight:800;color:#6781a6">${m.kcal} kcal</div></div><button class="btn ${done?'gray':'white'} sm" onclick="toggleMeal('${m.id}')">${done?'✓ 済':'記録'}</button></div>`}
function prettyDate(d){const a=parseDate(d);return `${a.getMonth()+1}月${a.getDate()}日（${names[a.getDay()]}）`}
function trendGraph(key,days=30,w=320,h=152){const rows=state.records.filter(x=>x.date>=shifted(today,-days)).slice().sort((a,b)=>a.date.localeCompare(b.date)),xval=r=>fnum(r[key]),vals=rows.map(xval).filter(Number.isFinite);if(!vals.length)return `<div class="empty">まだ記録がありません</div>`;const min=Math.min(...vals),max=Math.max(...vals),spread=Math.max(key==='weight'?1:.7,max-min),low=min-spread*.24,high=max+spread*.24,left=22,right=w-14,top=15,bottom=h-29,p=(r,i)=>({x:rows.length===1?(left+right)/2:left+(right-left)*i/(rows.length-1),y:bottom-(xval(r)-low)/(high-low)*(bottom-top)}),points=rows.map(p),color=key==='weight'?'var(--blue)':'var(--teal)';return `<div class="row" style="margin-bottom:7px"><b style="font-size:12px">${key==='weight'?'体重':'体脂肪率'}</b><span class="small">${key==='weight'?'kg':'%'}</span></div><svg class="trend" viewBox="0 0 ${w} ${h}" aria-label="${key==='weight'?'体重':'体脂肪率'}の推移" role="img">${[0,.5,1].map(a=>{const yy=top+(bottom-top)*a;return `<line class="gridline" x1="${left}" y1="${yy}" x2="${right}" y2="${yy}"/>`}).join('')}<text class="axislabel" x="${left}" y="${h-7}">${rows[0]?.date.slice(5)||''}</text><text class="axislabel" text-anchor="end" x="${right}" y="${h-7}">${rows.at(-1)?.date.slice(5)||''}</text><polyline class="plotline ${key==='bf'?'bf':''}" points="${points.map(z=>`${z.x},${z.y}`).join(' ')}" style="stroke:${color}"/>${points.map((z,i)=>`<circle class="plotdot ${key==='bf'?'bf':''}" cx="${z.x}" cy="${z.y}" r="${selectedPoint===rows[i].date?5:3.5}" onclick="choosePoint('${rows[i].date}')" tabindex="0"><title>${rows[i].date}: ${xval(rows[i])}${key==='weight'?'kg':'%'}</title></circle>`).join('')}</svg>`}
function deltaStats(span,key){let rows=[...state.records].sort((a,b)=>a.date.localeCompare(b.date)),now=rows.at(-1),from=rows.filter(r=>r.date<=shifted(today,-span)).at(-1)||rows[0];if(!now||!from)return null;let absolute=fnum(now[key])-fnum(from[key]),percent=fnum(from[key])?absolute/fnum(from[key])*100:0;return {absolute,percent,old:from[key],date:from.date};}
function analysisView(){const r=state.records.find(v=>v.date===selectedPoint)||latestRecord();return `${title('身体の変化を分析','グラフの点をタップするとその日のデータを表示。')}<div class="card"><div class="seg">${[[7,'7日'],[30,'30日'],[90,'90日'],[3650,'全期間']].map(([n,label])=>`<button class="${viewRange===n?'active':''}" onclick="viewRange=${n};render()">${label}</button>`).join('')}</div><div style="margin-top:20px">${trendGraph('weight',viewRange,320,165)}</div><div style="margin-top:22px">${trendGraph('bf',viewRange,320,165)}</div><div class="cardbg" style="margin-top:13px"><div class="small">${esc(r?.date||today)}の記録 ${selectedPoint?'（選択中）':'（最新）'}</div><div class="row" style="margin-top:6px"><b style="font-size:20px">${fnum(r?.weight).toFixed(1)} kg</b><b style="font-size:20px">${fnum(r?.bf).toFixed(1)} %</b></div></div></div><div class="sectionhead"><h2>変化率の比較</h2></div><div class="grid2">${[[7,'1週間'],[30,'1か月']].map(([n,label])=>{let d=deltaStats(n,'weight'),b=deltaStats(n,'bf');return `<div class="metric"><div class="fw">${label}</div><div class="tiny" style="margin-top:6px">体重</div><div class="value" style="font-size:20px">${d?`${d.percent>=0?'+':''}${d.percent.toFixed(1)}`:'--'}<small style="font-size:11px">%</small></div><div class="bar"><span style="width:${d?clamp(Math.abs(d.percent)*13,4,100):0}%"></span></div><div class="tiny" style="margin-top:10px">体脂肪率</div><div class="value" style="font-size:20px">${b?`${b.percent>=0?'+':''}${b.percent.toFixed(1)}`:'--'}<small style="font-size:11px">%</small></div><div class="bar"><span style="background:var(--teal);width:${b?clamp(Math.abs(b.percent)*13,4,100):0}%"></span></div></div>`}).join('')}</div><div class="note">変化率=(最新値−比較時点の値)÷比較時点の値×100。記録が足りない場合は最古のデータと比較します。</div>${footer()}`}
function recordView(){const r=latestRecord()||{weight:'',bf:''};return `${title('体の記録','体重・体脂肪率を日付ごとに保存。')}<div class="card"><div class="row"><b>測定データを追加</b><span class="badge green">保存対応</span></div><form id="recordForm" class="stack" style="margin-top:16px"><div class="field"><label for="recordDate">測定日</label><input type="date" id="recordDate" name="date" required value="${today}" max="${today}"></div><div class="grid2"><div class="field"><label for="recWeight">体重（kg）</label><input type="number" id="recWeight" name="weight" step="0.1" min="25" max="400" required placeholder="78.1" value="${esc(r.weight)}"></div><div class="field"><label for="recBF">体脂肪率（%）</label><input type="number" id="recBF" name="bf" step="0.1" min="2" max="65" required placeholder="19.3" value="${esc(r.bf)}"></div></div><button class="btn full" type="submit">この日の記録を保存</button></form></div><div class="sectionhead"><h2>最近の記録</h2><span class="badge gray">直近10件</span></div><div class="card" style="margin-top:0">${[...state.records].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,10).map(r=>`<div class="row" style="padding:9px 0;border-bottom:1px solid #f0f3f8"><span class="small">${esc(r.date)}</span><b>${fnum(r.weight).toFixed(1)}kg</b><span class="small">${fnum(r.bf).toFixed(1)}%</span><button class="btn link sm" onclick="deleteRecord('${r.date}')">削除</button></div>`).join('')||'<div class="empty">まだ記録がありません</div>'}</div><div class="sectionhead"><h2>データ管理</h2></div><div class="card" style="margin-top:0"><div class="stack"><button class="btn white full" onclick="exportData()">JSON形式でバックアップを書き出す</button><button class="btn gray full" onclick="document.getElementById('importFile').click()">バックアップを読み込む</button><input type="file" id="importFile" style="display:none" accept=".json,application/json"><span class="tiny">データはこのブラウザ内に保存されます。端末やブラウザが変わると自動同期されないため、定期的にバックアップしてください。</span></div></div>${footer()}`}
const footer=()=>`<div class="pagefooter">FITNOTE 試作版 2.0 ｜ カロリー・栄養計算・回復予測は概算です</div>`;
function modalView(){const hd=(t,content)=>`<div class="sheetwrap" onclick="if(event.target===this)closeModal()"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(t)}"><div class="grab"></div><div class="sheethead"><h2>${esc(t)}</h2><button class="close" onclick="closeModal()">×</button></div>${content}</div></div>`;if(modal==='settings'){const p=state.profile,t=targets();return hd('プロフィール・設定',`<div class="stack"><div class="grid2"><div class="field"><label>アカウント名</label><input id="pName" value="${esc(p.name)}" maxlength="25"></div><div class="field"><label>体脂肪率の目標（%）</label><input id="pTargetBF" type="number" min="3" max="60" step=".1" value="${esc(p.targetBF)}"></div></div><div class="grid2"><div class="field"><label>現在の体重（kg）</label><input id="pWeight" type="number" min="30" max="300" step=".1" value="${esc(p.weight)}"></div><div class="field"><label>目標体重（kg）</label><input id="pTargetWeight" type="number" min="30" max="300" step=".1" value="${esc(p.targetWeight)}"></div></div><div class="field"><label>目標日</label><input id="pTargetDate" type="date" value="${esc(p.targetDate)}" min="${today}"></div><div class="field"><label>カロリー手動設定（空欄=自動計算）</label><input id="pOverride" type="number" min="1000" max="6000" step="10" placeholder="自動計算：${t.kcal} kcal" value="${p.kcalOverride??''}"></div><div class="fw" style="margin-top:6px">プロテイン1杯あたりの栄養値</div><div class="grid3"><div class="field"><label>P（g）</label><input id="pShakeP" type="number" min="0" max="100" value="${fnum(p.shakeMacros?.p??24)}"></div><div class="field"><label>F（g）</label><input id="pShakeF" type="number" min="0" max="100" value="${fnum(p.shakeMacros?.f??2)}"></div><div class="field"><label>C（g）</label><input id="pShakeC" type="number" min="0" max="100" value="${fnum(p.shakeMacros?.c??3)}"></div></div><button class="btn full" onclick="saveSettings()">設定を保存</button><button class="btn white full" onclick="closeModal();openWizard(0)">食事・身体情報を最初から設定する</button><button class="btn gray full" onclick="exportData()">バックアップを出力</button><button class="btn link full" style="color:#bd5a60" onclick="resetDemo()">サンプルデータに初期化</button><div class="tiny">この版は端末内に保存する試作です。ログイン機能と複数端末同期は未実装です。</div></div>`)}if(modal.startsWith('meal:')){let id=modal.split(':')[1],m=getMeals()[0];if(id==='shake'){return hd('プロテインの調整',`<p class="small">メーカーの栄養成分表示を確認してください。現在は設定された1杯あたりのPFC値で計算しています。</p><div class="row"><button class="btncircle" onclick="adjustShake(-1)">−</button><b>${state.profile.shake}杯</b><button class="btncircle" onclick="adjustShake(1)">+</button></div>`)}m=getMeals().find(x=>x.id===id);if(!m)return '';const options=(menus[state.profile.style]||menus.balanced)[id]||[],idx=Number(state.mealChoice[id]||0);return hd(m.name,`<div class="row start" style="margin-bottom:15px"><div style="font-size:47px">${m.emoji}</div><div><b>${m.kcal} kcal（概算）</b><div class="small">P ${m.p}g ／ F ${m.f}g ／ C ${m.c}g</div></div></div><div class="cardbg"><div class="fw">材料例</div><div class="small" style="margin-top:7px;line-height:1.9">${esc(m.description)}</div><div class="note">分量は上の目標PFCに合わせて個別調整が必要です。表示は献立のイメージであり、食材量からの精密計算ではありません。</div></div><div class="sectionhead"><h2>献立を選び直す</h2></div>${options.map((o,i)=>`<button class="quest ${idx===i?'active':''}" style="margin:7px 0" onclick="chooseMenu('${id}',${i})"><span>${o.emoji} ${esc(o.name)}<div class="hint">${esc(o.desc)}</div></span><span>${idx===i?'✓':'›'}</span></button>`).join('')}<div class="field" style="margin:17px 0"><label>この献立の名前を変更</label><input id="mealName" value="${esc(m.name)}" maxlength="50"></div><button class="btn full" onclick="renameMeal('${id}')">献立名を保存</button>`)}if(modal.startsWith('ex:')){const id=modal.split(':')[1],e=exercises[id];return hd(e.name,`<div class="seg" style="margin-bottom:16px">${[['guide','ガイド'],['history','前回の記録'],['stats','分析']].map(([k,v])=>`<button class="${exerciseTab===k?'active':''}" onclick="exerciseTab='${k}';render()">${v}</button>`).join('')}</div>${exerciseTab==='guide'?`<div class="cardbg"><div class="fw">主に使う部位</div><p class="small" style="color:#336ce4">${e.muscle}${e.secondary?' / '+e.secondary:''}</p>${muscleSvg(e.muscle==='背中'?'back':'front',e.muscle)}<div class="line"></div><div class="fw">準備・動作のガイド</div><p class="small" style="line-height:1.9">${e.guide}</p><div class="fw">呼吸</div><p class="small">${e.breath}</p><div class="fw">注意</div><p class="small">${e.warning}</p></div>`:exerciseTab==='history'?`<div class="stack">${Object.entries(state.workoutLog).sort((a,b)=>b[0].localeCompare(a[0])).filter(([,x])=>x[id]>0).slice(0,6).map(([d,x])=>`<div class="row cardbg"><span>${d}</span><b>${x[id]}セット</b></div>`).join('')||'<div class="empty">まだ記録がありません</div>'}</div>`:`<div class="cardbg"><p>今週の${e.name}</p><div class="heavy">${weeksDates().reduce((n,d)=>n+workoutSets(d,id),0)} <span class="small">セット</span></div><div class="note">現在はセット数のみの記録です。重量・回数の記録は次期拡張候補です。</div></div>`}`)}return ''}
const bfRanges={male:['8〜12%','13〜17%','18〜23%','24〜29%','30〜34%','35〜39%','40%以上'],female:['15〜19%','20〜24%','25〜29%','30〜34%','35〜39%','40〜44%','45%以上']};
const bfVals={male:[10,15,20,26,32,37,42],female:[17,22,27,32,37,42,47]};
function bodyThumbnail(i){let w=30+i*2.8;return `<svg viewBox="0 0 92 90" role="img" aria-label="体型イラストの目安" style="width:100%;height:80px"><circle cx="46" cy="11" r="8" fill="#cdd8e5"/><path d="M40 19 Q${46-w} 24 ${46-w} 38 L${43-w/2} 69 Q36 76 33 88H59 Q56 75 ${49+w/2} 69 L${46+w} 38 Q${46+w} 24 52 19Z" fill="#d4deea" stroke="#f6f8fb" stroke-width="2"/>${i<3?'<path d="M39 33h14M39 42h14M40 51h12M46 29v29" stroke="#9dabbd" stroke-width="2" fill="none"/>':''}<path d="M28 78h36" stroke="#283747" stroke-width="8"/></svg>`}
function wizardView(){const p=state.profile,t=targets(),s=wizardStep;let h=`<header class="top"><div class="topline"><button class="btn link" onclick="leaveWizard()">‹ 閉じる</button><b>はじめの設定</b><span class="badge">${s+1} / 7</span></div></header><main class="wizard"><div class="steps">${Array.from({length:7},(_,i)=>`<span class="${i<=s?'on':''}"></span>`).join('')}</div>`;
if(s===0)h+=`<div class="eyebrow">STEP 01 · BODY</div><div class="hero-step">あなたの体の情報を<br>教えてください。</div><p class="intro">目標カロリーの推定に使います。あとから変更可能です。</p><div class="stack" style="margin-top:27px"><div class="field"><label>アカウント名</label><input id="wName" value="${esc(p.name)}" placeholder="ニックネーム" maxlength="25"></div><div class="grid2"><div class="field"><label>年齢</label><input type="number" id="wAge" min="15" max="95" value="${esc(p.age)}"></div><div class="field"><label>身長（cm）</label><input type="number" id="wHeight" min="100" max="230" value="${esc(p.height)}"></div></div><div class="field"><label>体重（kg）</label><input type="number" id="wWeight" min="30" max="300" step=".1" value="${esc(p.weight)}"></div><div class="field"><label>消費カロリー推定に使用する身体区分（計算式の選択）</label><select id="wSex"><option value="male" ${p.sex==='male'?'selected':''}>男性の推定式</option><option value="female" ${p.sex==='female'?'selected':''}>女性の推定式</option></select></div></div>`;
if(s===1){let sex=p.sex||'male';h+=`<div class="eyebrow">STEP 02 · BODY FAT</div><div class="hero-step">自分に近い体型は？</div><p class="intro">体脂肪率がわからない場合の参考用です。見た目だけで正確には判定できません。</p><div class="grid3" style="margin-top:21px">${bfRanges[sex].map((v,i)=>`<button class="percenttile ${Math.abs(fnum(p.bf)-bfVals[sex][i])<2.5?'active':''}" onclick="setBF(${bfVals[sex][i]})">${bodyThumbnail(i)}<small>${v}</small></button>`).join('')}</div><div class="field" style="margin-top:15px"><label>計測値がある場合はこちらに入力（%）</label><input id="wBF" type="number" min="2" max="65" step=".1" value="${esc(p.bf)}"></div><p class="notice">体脂肪率は目標値が低いほど良いわけではありません。極端に低い数値は推奨しません。</p>`}

if(s===3)h+=`<div class="eyebrow">STEP 04 · GOAL</div><div class="hero-step">目標体重と達成日を<br>決めましょう。</div><div class="card" style="margin-top:20px"><div class="tiny">現在の推定消費カロリー（維持の目安）</div><div class="heavy">${t.tdee.toLocaleString()} <span style="font-size:14px">kcal / 日</span></div><div class="note">Mifflin–St Jeor式 × 活動係数で概算。体重推移で調整してください。</div></div><div class="stack" style="margin-top:14px"><div class="grid2"><div class="field"><label>目標体重（kg）</label><input id="wTargetWeight" type="number" min="30" max="300" step=".1" value="${esc(p.targetWeight)}"></div><div class="field"><label>目標体脂肪率（%）</label><input id="wTargetBF" type="number" min="3" max="60" step=".1" value="${esc(p.targetBF)}"></div></div><div class="field"><label>目標日</label><input id="wTargetDate" type="date" min="${today}" value="${esc(p.targetDate)}"></div><div class="field"><label>達成ペース</label><div class="seg">${[['slow','ゆっくり'],['standard','標準'],['fast','速め']].map(([v,n])=>`<button class="${p.pace===v?'active':''}" onclick="setPace('${v}')">${n}</button>`).join('')}</div></div><p class="notice">目標と日程の組み合わせによっては、安全で現実的なペースにならないことがあります。極端な減量や増量は避けましょう。</p></div>`;
if(s===4)h+=`<div class="eyebrow">STEP 05 · FOOD STYLE</div><div class="hero-step">どんな食事プランが<br>お好みですか？</div><p class="intro">スタイルを選ぶと献立と栄養配分の初期設定が切り替わります。</p><div class="stack" style="margin-top:19px">${[['balanced','🍚','バランス食','PFCをバランスよく'],['lowfat','🐟','ローファット','脂質控えめ'],['lowcarb','🥑','ローカーボ','炭水化物控えめ'],['keto','🥩','ケトジェニック','糖質を大幅に抑える特殊な食事法']].map(([v,emoji,n,d])=>`<button class="quest ${p.style===v?'active':''}" onclick="setStyle('${v}')"><span>${emoji} ${n}<div class="hint">${d}</div></span><span>${p.style===v?'✓':'○'}</span></button>`).join('')}</div><div class="sectionhead"><h2>1日の食事タイミング</h2></div><div class="grid2">${['朝食','昼食','夕食','間食'].map(k=>`<label class="quest"><span>${k}</span><input type="checkbox" data-meal-timing="${k}" ${(p.mealTiming||[]).includes(k)?'checked':''}></label>`).join('')}</div>`;
if(s===5)h+=`<div class="eyebrow">STEP 06 · WEEKLY PLAN</div><div class="hero-step">1週間の食事量を<br>どう配分しますか？</div><div class="stack" style="margin-top:22px">${[['even','均等に配分','毎日同じカロリー目標'],['training','トレーニング日を少し多く','筋トレ日 +8%／その他の日を調整']].map(([v,n,d])=>`<button class="quest ${p.distribution===v?'active':''}" onclick="setDistribution('${v}')"><span>${n}<div class="hint">${d}</div></span><span>${p.distribution===v?'✓':'○'}</span></button>`).join('')}</div><div class="sectionhead"><h2>トレーニング曜日</h2></div><div class="row" style="justify-content:flex-start;gap:6px">${[1,2,3,4,5,6,0].map(v=>`<button class="chip ${(p.trainingDays||[]).includes(v)?'active':''}" style="flex:1;padding:11px 4px" onclick="toggleTrainDay(${v})">${names[v]}</button>`).join('')}</div><p class="note">毎日の体重変化は水分などでも上下します。曜日別配分では週間平均を基準にします。</p>`;
if(s===6)h+=`<div class="eyebrow">STEP 07 · PROTEIN</div><div class="hero-step">1日のたんぱく質を<br>設定しましょう。</div><p class="intro">体重に対する倍率を選択。あとから自由に変更できます。</p><div class="stack" style="margin-top:23px">${[[1,'少なめ','一般的な生活向け'],[1.6,'標準','筋トレ・体づくり向け'],[2,'多め','十分な運動をする人向け'],[2.2,'高め','食事バランスに留意して選択']].map(([v,n,d])=>`<button class="quest ${p.proteinFactor===v?'active':''}" onclick="setProtein(${v})"><span>${n}<div class="hint">体重 × ${v}g ／ ${d}</div></span><span>${round(fnum(p.weight)*v)}g</span></button>`).join('')}</div><div class="card"><div class="tiny">現在の設定に基づく目安</div><div class="heavy">${t.kcal.toLocaleString()} <span style="font-size:13px">kcal / 日</span></div><div class="row"><span class="small">P ${t.protein}g</span><span class="small">F ${t.fat}g</span><span class="small">C ${t.carbs}g</span></div></div><p class="note">数値は個人差があります。医療的な栄養管理が必要な方は医療専門職に相談してください。</p>`;
h+=`<div class="actions"><button class="btn gray" style="flex:.55" onclick="${s===0?'leaveWizard()':'prevWizard()'}">${s===0?'閉じる':'戻る'}</button><button class="btn" onclick="nextWizard()">${s===6?'設定を保存して始める':'次へ進む'}</button></div></main>`;return h}
function cacheWizardStep(){let p=state.profile;const num=(id,min,max)=>{const el=document.getElementById(id);if(!el)return null;let n=Number(el.value);return Number.isFinite(n)?clamp(n,min,max):null};if(wizardStep===0){p.name=($('#wName')?.value||'ゲスト').trim().slice(0,25)||'ゲスト';for(let [id,key,min,max] of [['wAge','age',15,95],['wHeight','height',100,230],['wWeight','weight',30,300]]){let val=num(id,min,max);if(val!==null)p[key]=val}p.sex=$('#wSex')?.value||'male'}if(wizardStep===1){let v=num('wBF',2,65);if(v!==null)p.bf=v}if(wizardStep===3){for(let [id,key] of [['wTargetWeight','targetWeight'],['wTargetBF','targetBF']]){let v=num(id,2,300);if(v!==null)p[key]=v}if($('#wTargetDate')?.value)p.targetDate=$('#wTargetDate').value}if(wizardStep===4){let checked=[...document.querySelectorAll('[data-meal-timing]:checked')].map(x=>x.dataset.mealTiming);if(checked.length)p.mealTiming=checked}}
function nextWizard(){cacheWizardStep();if(wizardStep<6){wizardStep++;save();render();window.scrollTo(0,0)}else{if(state.demo){state.records=[];state.mealLog={};state.workoutLog={}}state.demo=false;state.profile.wizardDone=true;state.records=[...state.records.filter(r=>r.date!==today),{date:today,weight:fnum(state.profile.weight),bf:fnum(state.profile.bf)}];save();page='home';render();window.scrollTo(0,0);notify('初期設定を保存しました')}}
function prevWizard(){cacheWizardStep();wizardStep=Math.max(0,wizardStep-1);render();window.scrollTo(0,0)}
function openWizard(s=0){modal='';wizardStep=s;page='wizard';render();window.scrollTo(0,0)}
function leaveWizard(){cacheWizardStep();save();page='home';render();window.scrollTo(0,0)}
function setBF(n){state.profile.bf=n;render()}
function setActivity(n){state.profile.activity=n;render()}
function setPace(n){state.profile.pace=n;cacheWizardStep();render()}
function setStyle(n){state.profile.style=n;render()}
function setDistribution(n){state.profile.distribution=n;render()}
function toggleTrainDay(d){let a=state.profile.trainingDays||[];state.profile.trainingDays=a.includes(d)?a.filter(v=>v!==d):[...a,d];render()}
function setProtein(n){state.profile.proteinFactor=n;render()}
function showModal(s){modal=s;render()}
function closeModal(){modal='';render()}
function go(p){modal='';page=p;render();window.scrollTo(0,0)}
function weekMove(n){weekOffset=clamp(weekOffset+n,-52,Math.max(1,Math.min(52,Math.ceil(targets().days/7))));chosenDate=weekOffset===0?today:weeksDates(weekOffset)[0];render()}
function pickDay(d){chosenDate=d;render()}
function adjustShake(n){state.profile.shake=clamp(fnum(state.profile.shake)+n,0,5);save();render()}
function toggleMeal(id){state.mealLog[chosenDate]??={};state.mealLog[chosenDate][id]=!state.mealLog[chosenDate][id];save();render();notify(state.mealLog[chosenDate][id]?'食事を記録しました':'食事記録を取り消しました')}
function openMeal(id){modal='meal:'+id;render()}
function chooseMenu(id,n){state.mealChoice[id]=n;delete state.mealTitles[id];save();render()}
function renameMeal(id){let v=($('#mealName')?.value||'').trim().slice(0,50);if(!v)return notify('献立名を入力してください');state.mealTitles[id]=v;save();render();notify('献立名を保存しました')}
function adjustSet(id,n){state.workoutLog[chosenDate]??={};state.workoutLog[chosenDate][id]=Math.max(0,workoutSets(chosenDate,id)+n);save();render()}
function openExercise(id){modal='ex:'+id;exerciseTab='guide';render()}
function choosePoint(d){selectedPoint=d;render()}
function deleteRecord(d){if(!window.confirm(`${d} の記録を削除しますか？`))return;state.records=state.records.filter(x=>x.date!==d);save();render();notify('記録を削除しました')}
function saveSettings(){const p=state.profile;let v=$('#pName')?.value.trim();if(v)p.name=v.slice(0,25);for(let [id,key,a,b] of [['pTargetBF','targetBF',3,60],['pWeight','weight',30,300],['pTargetWeight','targetWeight',30,300]]){let val=Number($(id.startsWith('#')?id:'#'+id)?.value);if(Number.isFinite(val)&&val>=a&&val<=b)p[key]=val}if($('#pTargetDate')?.value)p.targetDate=$('#pTargetDate').value;let k=$('#pOverride')?.value;p.kcalOverride=k!==''&&k!==undefined?clamp(Number(k),1000,6000):null;p.shakeMacros={p:clamp(fnum($('#pShakeP')?.value),0,100),f:clamp(fnum($('#pShakeF')?.value),0,100),c:clamp(fnum($('#pShakeC')?.value),0,100)};if(state.demo){state.records=[{date:today,weight:fnum(p.weight),bf:fnum(p.bf)}];state.mealLog={};state.workoutLog={}}state.demo=false;save();modal='';render();notify('設定を保存しました')}
function resetDemo(){if(!window.confirm('保存した記録をすべて消去してデモデータに戻しますか？'))return;state=initial();save();page='home';modal='';render();notify('初期化しました')}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`fitnote-backup-${today}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),500);notify('バックアップを書き出しました')}
function bindInputs(){let fm=$('#recordForm');if(fm)fm.addEventListener('submit',e=>{e.preventDefault();const data=new FormData(fm),date=String(data.get('date')),weight=Number(data.get('weight')),bf=Number(data.get('bf'));if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||date>today||!(weight>=25&&weight<=400)||!(bf>=2&&bf<=65)){notify('日付・体重・体脂肪率を確認してください');return}if(state.demo){state.records=[];state.workoutLog={};state.mealLog={}}state.records=state.records.filter(r=>r.date!==date);state.records.push({date,weight,bf});state.records.sort((a,b)=>a.date.localeCompare(b.date));if(date===today){state.profile.weight=weight;state.profile.bf=bf}state.demo=false;save();selectedPoint=date;render();notify('測定データを保存しました')});let wk=$('#workDate');if(wk)wk.addEventListener('change',e=>{if(e.target.value&&e.target.value<=today){chosenDate=e.target.value;render()}});let imp=$('#importFile');if(imp)imp.addEventListener('change',async e=>{let file=e.target.files?.[0];if(!file)return;try{if(file.size>1000000)throw new Error('ファイルが大きすぎます');let obj=JSON.parse(await file.text());if(!obj||obj.version!==2||!obj.profile||!Array.isArray(obj.records)||!obj.mealLog||!obj.workoutLog)throw new Error('FITNOTE 2.0のバックアップではありません');if(!window.confirm('現在のデータをバックアップの内容で上書きしますか？'))return;state=obj;save();page='home';render();notify('データを読み込みました')}catch(er){notify(er.message||'読み込めませんでした')}})}
window.addEventListener('storage',e=>{if(e.key===KEY){try{let s=JSON.parse(e.newValue);if(s&&s.profile&&Array.isArray(s.records)){state=s;render()}}catch{}}});
render();
</script></body></html>
